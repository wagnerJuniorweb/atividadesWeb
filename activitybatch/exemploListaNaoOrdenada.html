<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset='utf-8'> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>exemplo lista não ordenadas</title>
    </head>
    <body>
        <h3>exemplo lista não ordenadas</h3>

        <ul>
            <li>cafe</li>
            <li>leite</li>
            <li>pão</li>
        </ul>
        <ul type="circle">
            <li>different thing</li>
            <li>two</li>
        </ul>
        <ul type="square">
            <li>different thing</li>
            <li>two</li>
        </ul>
        <ul type="none">
            <li>different thing</li>
            <li>two</li>
        </ul>
    </body>
</html>
