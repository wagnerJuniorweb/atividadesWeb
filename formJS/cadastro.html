<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial=1.0">
		<link rel="stylesheet" href="styles.css">
		<title>Sign up page</title>
	</head>
    <body>
        <form action="#" method="post">
            <h3>Sign up</h3>
            <div>
                <label for="idname">name</label>
                <input type="text" id="idname" name="name" placeholder="Type your name" required>
            </div>
            <p></p>
            <div>
                <label for="idemail">E-mail</label>
                <input type="email" id="idemail" name="email" placeholder="Type your E-mail" required>
            </div>
            <p></p>
            <div>
                <label for="idpassword">Password</label>
                <input type="password" id="idpassword" name="password" placeholder="Type your password" required minlength="6">
            </div>
            <p></p>
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
        </form>
    </body>
</html>
