
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Página de Cadastro</title>
</head>
<body>
    <main class="container">
        <form action="resultado.html" method="post">
            <fieldset>
                <h1>Cadastro de Produtos</h1>

                <div class="form-group">
                    <label for="idcodigo">Código do Produto:</label>
                </div>
                <div class="form-group">
                    <input type="text" id="idcodigo" name="codigo" required placeholder="Ex: 1234567891011">
                </div>

                <div class="form-group">
                    <label for="idnome">Nome do Produto:</label>
                </div>
                <div class="form-group">
                    <input type="text" id="idnome" name="nome" required placeholder="Ex: Feijão tropeiro 2kg">
                </div>

                <div class="form-group">
                    <label for="iddesc">Descrição:</label>
                </div>
                <div class="form-group">
                    <textarea id="iddesc" name="descricao" required placeholder="Detalhes sobre o produto..."></textarea>
                </div>
                <div class="form-group">
                    <label for="iddata">Data de Cadastro</label>
                </div>
                <div class="form-group">
                    <input type="date" id="iddata" name="dataCadastro" required>
                </div>

                <div class="form-group price-stock">
                    <label for="idpreco">Preço (R$):</label>
                    
                    <label for="idestoque">Estoque Inicial:</label>
                </div>
                <div class="form-group price-stock">
                    <input type="text" id="idpreco" name="preco" required minlength="3" placeholder="0,00">
                    <input type="text" id="idestoque" name="estoque" required placeholder="0" min="0">
                </div>

                <div class="form-group">
                    <label for="iddisciplina">Categoria do Produto:</label>
                    <select name="disciplina" id="iddisciplina">
                        <option value="">Selecione uma categoria</option>
                        <option value="alimento">Alimentos</option>
                        <option value="bebida">Bedidas</option>
                        <option value="eletro">Eletrônicos</option>
                        <option value="limpeza">Limpeza</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-reset">Limpar Campos</button>
                    <button type="submit" class="btn-submit">Cadastrar Produto</button>
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
