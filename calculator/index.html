<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>calculator</title>
</head>
<body>

    <div class="container">
        <h2>calculator</h2>

        <form action="resultado.html" method="GET">
            <div class="campo">
                <label for="numero1">First number:</label>
                <input type="text" id="numero1" name="numero1" required>
            </div>
            <div class="campo">
                <label for="numero2">Second number:</label>
                <input type="text" id="numero2" name="numero2" required>
            </div>

            <div class="campo">
                <label for="operacao">Operation:</label>
                <select id="operacao" name="operacao" required>
                    <option value="soma">Add</option>
                    <option value="subtracao">Subtract</option>
                    <option value="multiplicacao">Multiply</option>
                    <option value="divisao">Divide</option>
                </select>
            </div>
            <button type="submit">Calculate</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
